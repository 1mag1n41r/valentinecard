<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>你的信 💌</title>
  <link rel="stylesheet" href="styles.css" />
</head>

<body class="page page-letter">
  <div class="float-parrots" aria-hidden="true">
    <i class="parrot-walker p1"></i>
    <i class="parrot-walker p2"></i>
    <i class="parrot-walker p3"></i>
    <i class="parrot-walker p4"></i>
    <i class="parrot-walker p5"></i>
    <i class="parrot-walker p6"></i>
  </div>
  <div id="confetti" class="confetti" aria-hidden="true"></div>

  <main class="center">
    <section class="card card-wide card-letter">
      <div class="topbar">
        <div>
          <h1 class="h1-small"></h1>
          <p class="sub">打開我</p>
        </div>
        <a class="link" href="index.html">← Back</a>
      </div>

      <div class="letter-stage">
        <div
          class="envelope reveal"
          id="envelope"
          role="button"
          tabindex="0"
          aria-pressed="false"
          aria-label="Open letter"
        >
          <div class="env-body"></div>

          <div class="paper" aria-hidden="false">
            <div class="paper-inner">
              <div class="flower-scatter" aria-hidden="true">
                <i class="flower f1" data-src="Subject.png"></i>
                <i class="flower f2" data-src="Subject 2.png"></i>
                <i class="flower f3" data-src="Subject 3.png"></i>
                <i class="flower f4" data-src="Subject 4.png"></i>
                <i class="flower f5" data-src="Subject 2.png"></i>
                <i class="flower f6" data-src="Subject.png"></i>
                <i class="flower f7" data-src="Subject 4.png"></i>
                <i class="flower f8" data-src="Subject 3.png"></i>
                <i class="flower f9" data-src="Subject.png"></i>
                <i class="flower f10" data-src="Subject 2.png"></i>
              </div>
              <div class="idle-parrot-scatter" aria-hidden="true">
                <i class="idle-parrot rp1"></i>
                <i class="idle-parrot rp2"></i>
                <i class="idle-parrot rp3"></i>
                <i class="idle-parrot rp4"></i>
                <i class="idle-parrot rp5"></i>
                <i class="idle-parrot rp6"></i>
              </div>
              <!-- ===================== EDIT HERE ===================== -->
              <h2>嗨 芒果🐷,</h2>
              <p>
                謝謝你再一年的陪伴
              </p>
              <p>
                雖然我不是對你很好，但謝謝你可以接受我<br>
                跟你交往了我可以吃到很多好吃的食物，吃很多好吃的甜點
                還有可以笑的很開心.
                我們一起過的時間都對我很深刻，希望可以再加越來越多的記憶.
                因為愛的還是bobo,我會慢慢升級成你最愛的。<br>
                情人節快樂！！！
              </p>
              <p>
                ps:我個人不太會寫信，請你原諒我<br>
                ps:我沒有用gpt寫
              </p>
              <div class="sig">
                <span>— 你的灰太狼</span>
                <span>🐺</span>
              </div>
              <!-- ===================================================== -->
            </div>
          </div>

          <div class="fold-left"></div>
          <div class="fold-right"></div>
          <div class="fold-bottom"></div>

          <div class="flap"></div>
          <div class="seal" aria-hidden="true"><span>✉</span></div>
        </div>

        <p class="tiny center-text">Click to open</p>
      </div>
    </section>
  </main>

  <script src="letter.js"></script>
</body>
</html>
